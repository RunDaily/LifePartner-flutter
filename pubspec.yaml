name: flutter_application_1
description: "A beautiful Flutter diary app - Android / iOS / HarmonyOS."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

# ══════════════════════════════════════════════════════════════
#  此文件为 Android / iOS 依赖配置（官方 Flutter SDK）
#  使用方法：cp pubspec_mobile.yaml pubspec.yaml
#  或运行：./switch_platform.sh android
# ══════════════════════════════════════════════════════════════

dependencies:
  flutter:
    sdk: flutter

  # ── 数据持久化 ──────────────────────────────────────────────
  sqflite: ^2.3.3
  path: ^1.9.0

  # ── KV 存储 ─────────────────────────────────────────────────
  shared_preferences: ^2.3.2

  # ── 状态管理（三端无差异，纯 Dart）──────────────────────────
  provider: ^6.1.2

  # ── 国际化（三端无差异，纯 Dart）───────────────────────────
  intl: ^0.20.2

  # ── ID 生成（三端无差异，纯 Dart）──────────────────────────
  uuid: ^4.5.1

  # ── UI 组件（三端无差异，纯 Flutter）────────────────────────
  flutter_staggered_animations: ^1.1.1
  google_fonts: ^6.2.1
  flutter_slidable: ^3.1.1

  # ── 系统日历集成（直接静默写入，无需弹出原生界面） ──────────────
  device_calendar: ^4.3.2
  permission_handler: ^11.3.1
  timezone: ^0.9.4

  # ── 文件路径（跨平台获取 App 文档目录）──────────────────────
  path_provider: ^2.1.4

  # ── 图片选择（相册 / 相机）───────────────────────────────────
  image_picker: ^1.1.2

  # ── 剪贴板图片粘贴（跨平台读取剪贴板内图片数据）─────────────
  super_clipboard: ^0.8.22

  # ── AI 网络请求 ──────────────────────────────────────────────
  http: ^1.2.2

  # ── Markdown 渲染（AI 对话气泡）──────────────────────────────
  flutter_markdown: ^0.7.6

dependency_overrides:
  # win32_registry 1.1.5 (device_info_plus 传递依赖) 需要 win32 ^5.5.4
  # 升级到 5.x 以解决兼容性问题（win32 5.x 仅在 Windows 平台编译，非 Windows 无影响）
  win32: ^5.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
